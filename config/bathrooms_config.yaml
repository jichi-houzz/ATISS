data:
    dataset_type: "bathroom"
    encoding_type: "autoregressive_wocm"
    dataset_directory: "data/preprocessed"
    train_split_file: "data/train_scenes.txt"
    val_split_file: "data/val_scenes.txt"
    test_split_file: "data/test_scenes.txt"
    augmentations: ["rotations"]
    filter_fn: "bathroom"
    train_stats: "dataset_stats.txt"
    room_layout_size: "128,128"
network:
    type: "autoregressive_transformer"
    n_layers: 4
    n_heads: 8
    query_dimensions: 64
    value_dimensions: 64
    feed_forward_dimensions: 1024
    hidden2output_layer: "autoregressive_mlc"
    hidden_dims: 512
    with_extra_fc: false
    bbox_output: "autoregressive_mlc"
    n_mixtures: 10
    use_room_mask_as_features: true
feature_extractor:
    name: "resnet18"
    feature_size: 64
    freeze_bn: true
    input_channels: 1
training:
    splits: ["train", "val"]
    epochs: 300
    steps_per_epoch: 50
    batch_size: 32
    save_frequency: 10
    optimizer: Adam
    lr: 0.0001
    weight_decay: 0.0
validation:
    splits: ["test"]
    frequency: 5
    batch_size: 32
logger:
    type: "tensorboard"
    project: "bathroom_layout_generation"
